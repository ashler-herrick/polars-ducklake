[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polars-ducklake"
version = "0.2.0"
description = "Native DuckLake reader for Polars (no DuckDB runtime dependency)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Ashler Herrick" }]
keywords = ["polars", "ducklake", "lakehouse", "parquet"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
]
dependencies = [
    "polars>=1.20",
    "sqlalchemy>=2.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]
duckdb-catalog = ["duckdb-engine>=0.13"]
mysql = ["pymysql>=1.1"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "mypy>=1.10",
    "pyarrow>=15",
]

[project.urls]
Homepage = "https://github.com/ashlerjherrick/polars-ducklake"
Repository = "https://github.com/ashlerjherrick/polars-ducklake"
Issues = "https://github.com/ashlerjherrick/polars-ducklake/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/polars_ducklake"]

[tool.hatch.build.targets.sdist]
include = ["src/polars_ducklake", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF",
]
ignore = [
    "E501", # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/polars_ducklake", "tests"]
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["boto3", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: integration tests requiring external services",
]

[tool.coverage.run]
source = ["src/polars_ducklake"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = false

[dependency-groups]
dev = [
    "boto3>=1.43.0",
    "cryptography>=47.0.0",
    "duckdb>=1.5.2",
    "duckdb-engine>=0.17.0",
    "mypy>=1.20.2",
    "psycopg[binary]>=3.3.3",
    "pyarrow>=24.0.0",
    "pymysql>=1.1.2",
    "pytest>=9.0.3",
]
